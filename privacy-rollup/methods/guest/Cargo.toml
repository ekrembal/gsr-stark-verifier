[workspace]
resolver = "2"

[package]
name = "pr-guest"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "verify_joinsplit"
path = "src/bin/verify_joinsplit.rs"

[[bin]]
name = "apply_batch"
path = "src/bin/apply_batch.rs"

[[bin]]
name = "sha256_vectors"
path = "src/bin/sha256_vectors.rs"

[dependencies]
risc0-zkvm = { path = "../../../../risc0/risc0/zkvm", default-features = false, features = ["std", "unstable"] }
provekit-common = { path = "../../../../provekit/provekit/common" }
provekit-verifier = { path = "../../../../provekit/provekit/verifier" }
postcard = { version = "1.1.3", features = ["alloc"] }
tracing = { version = "0.1.44", features = ["std"] }
risc0-bigint2 = { path = "../../../../risc0/risc0/bigint2" }
ark-bn254 = { version = "0.6.0", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.6.0", default-features = false }
pr-crypto = { path = "../../crates/crypto" }
pr-protocol-types = { path = "../../crates/protocol-types" }
pr-state-transition = { path = "../../crates/state-transition" }
risc0-zkvm-platform = { path = "../../../../risc0/risc0/zkvm/platform", features = ["sys-getenv"] }
# Validation uses the same versions/features already present transitively.
sha2 = { version = "=0.10.9", default-features = false, features = ["compress"] }
whir = { package = "provekit-whir", version = "=0.2.0" }

[profile.release]
lto = true
opt-level = 3

# Upstream hashes `usize` squeeze counters with `to_be_bytes`, which is 4 bytes on riscv32 and
# 8 bytes on the host; the vendored copy hashes them as `u64` on every target.
[patch.crates-io]
provekit-spongefish = { path = "../../vendor/provekit-spongefish" }
ark-ff = { path = "../../vendor/ark-ff" }
provekit-whir = { path = "../../vendor/provekit-whir" }
# Official same-version SHA-256 accelerator; native/client workspace stays on registry sha2.
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", rev = "8631fabdea7bdffa97b11868e04e73491d8e5bcf" }
