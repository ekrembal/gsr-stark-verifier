[package]
name = "pr-prover"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
pr-methods = { path = "../methods" }
pr-protocol-types = { path = "../crates/protocol-types" }
pr-state-transition = { path = "../crates/state-transition" }
pr-joinsplit = { path = "../crates/joinsplit" }
risc0-zkvm = { path = "../../../risc0/risc0/zkvm", default-features = false, features = ["prove", "unstable"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde_json = "1.0"
hex = "0.4.3"
bytemuck = "1.16"
anyhow = "1.0"
tracing = "=0.1.44"
serde = { version = "1.0", features = ["derive"] }
[workspace]
members = ["sdk", "batcher", "sdk-wasm"]
