[package]
name = "pr-batcher"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
pr-sdk = { path = "../sdk", default-features = false, features = ["prove"] }
pr-prover = { path = ".." }
pr-operator = { path = "../../operator" }
pr-protocol-types = { path = "../../crates/protocol-types" }
pr-mempool = { path = "../../crates/mempool" }
pr-bitcoin-adapter = { path = "../../crates/bitcoin-adapter" }
pr-scanner = { path = "../../crates/scanner" }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
postcard = { version = "1.1.3", features = ["alloc"] }
anyhow = "1.0"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "schnorr"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
