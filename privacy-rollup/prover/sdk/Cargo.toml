[package]
name = "pr-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["prove", "client"]
# User-side zero-knowledge proving (RISC Zero prover).
prove = ["dep:pr-prover"]
# Blocking HTTP client of the `pr-batcher` API.
client = ["dep:reqwest"]

[dependencies]
pr-protocol-types = { path = "../../crates/protocol-types" }
pr-wallet-core = { path = "../../crates/wallet-core" }
pr-joinsplit = { path = "../../crates/joinsplit" }
pr-mempool = { path = "../../crates/mempool" }
pr-commitment-tree = { path = "../../crates/commitment-tree" }
pr-prover = { path = "..", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json"], optional = true }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
anyhow = "1.0"
