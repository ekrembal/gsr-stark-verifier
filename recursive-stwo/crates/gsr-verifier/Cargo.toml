[package]
name = "gsr-verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bincode = "1.3.3"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
num-traits = "0.2"
stwo-prover = { path = "../../vendor/bws-stwo/crates/prover", features = ["parallel"] }
recursive-stwo-delegation = { path = "../../vendor/bws-bitcoin/delegation" }
recursive-stwo-last = { path = "../../vendor/bws-bitcoin/last" }
recursive-stwo-primitives = { path = "../../vendor/bws-bitcoin/primitives" }
recursive-stwo-bitcoin-dsl = { path = "../../vendor/bws-bitcoin/bitcoin_dsl" }

circle-plonk-dsl-hints = { path = "../../vendor/bws-recursion/components/hints" }
